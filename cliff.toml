# git-cliff config: `git cliff --unreleased --tag vX.Y.Z --prepend CHANGELOG.md`
# drafts the next release section from conventional commits (feat:, fix:, ...).
# Review and edit the result — it is a draft, not the final notes.

[changelog]
header = ""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^(chore|ci|test|style|build)", skip = true },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
