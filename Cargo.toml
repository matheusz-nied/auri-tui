[package]
name = "auri-tui"
version = "0.1.0"
edition = "2021"
description = "Browse files and git diffs side by side, right in your terminal"
license = "MIT"
authors = ["Matheus"]
repository = "https://github.com/matheusz-nied/auri-tui"
homepage = "https://matheusz-nied.github.io/auri-tui"
readme = "README.md"
keywords = ["git", "diff", "tui", "terminal", "file-explorer"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/site", "/demo", "/BACKLOG.md", "/LAUNCH_CHECKLIST.md", "/AGENTS.md", "/.mimocode", "/RELEASING.md", "/cliff.toml", "/dist-workspace.toml"]

[[bin]]
name = "auri"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
toml = "=1.1.6"
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[dev-dependencies]
tempfile = "=3.27.0"

# Syntax highlighting (syntect/fancy-regex) is ~10x slower unoptimized;
# optimizing dependencies keeps `cargo run` responsive.
[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
